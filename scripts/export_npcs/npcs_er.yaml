# Maps the ID of ESD scripts to the NPC name.
#
# A 3-digit ID is the prefix after the `t` in the ESD file names (t301006000 -> "301")
# and covers all scripts of that NPC. A 9-digit ID is a single script, used where the
# prefix is shared by multiple NPCs or where a script deviates from its prefix.
# Keys must be quoted, otherwise YAML reads them as numbers.
#
# Not included: sites of grace, rebirth monuments, and other non-NPC scripts.

# --- single scripts ---
"000003000": Melina
"307106000": Pidia, Carian Servant
"705061203": Wandering Noble Ghost
"705081203": Noble Ghost

