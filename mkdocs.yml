site_name: Yonder
repo_url: https://github.com/ndahn/yonder
site_url: https://ndahn.github.io/yonder/
site_author: Nikolas Dahn
site_description: "A graphical editor for wwise soundbanks"
copyright: Nikolas Dahn
theme:
  favicon: assets/images/icon.png
  logo: assets/images/icon.png
  name: material
  custom_dir: docs/overrides
  font:
    text: Noto Sans
  features:
    - announce.dismiss
    - content.code.copy
    - header.autohide
    - navigation.tabs
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.tabs
    - navigation.tracking
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
  palette:
    - scheme: slate
      primary: light blue
      accent: deep purple

nav:
  - Home: index.md
  - Wwise:
    - Soundbanks: wwise/soundbanks.md
    - Globals: wwise/globals.md
    - Events: wwise/events.md
    - Containers: wwise/containers.md
    - Sources: wwise/sources.md
    - RTPCs: wwise/rtpcs.md
    - States: wwise/states.md
    - Attenuation: wwise/attenuation.md
  - HowTo:
    - How to use Yonder: howto/yonder.md
    - About Hashes: howto/hashes.md
    - Wems & Wavs: howto/wems.md
    - DLLs: howto/dlls.md
    - Boss BGMs: howto/boss_bgm.md
    - Area BGMs: howto/area_bgm.md
  - Tools:
    - Transfering Sounds: tools/mass_transfer.md
    - Unmangling Soundbanks: tools/unmangle.md
  - API Reference

exclude_docs: "!/templates/"

plugins:
  - search
  - mkdocstrings:
      handlers:
          python:
            options:
              docstring_style: numpy
              show_signature_annotations: true
              separate_signature: true
              show_source: false
              show_symbol_type_heading: true
              show_symbol_type_toc: true
              scoped_crossrefs: true
  - api-autonav:
      modules: ["yonder"]
      nav_item_prefix: ""

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      toc_depth: "1-3"
      permalink: true
  # Python Markdown Extensions
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tilde
  - pymdownx.emoji:
      emoji_index: !!python/name:pymdownx.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg